<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/bf7220ad33.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap"
      rel="stylesheet"
    />
    <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
  </head>

  <body>
    <!-- Start coding here -->
    <div class="container">
      <header class="header">
        <h1>Techup Chatroom</h1>
      </header>

      <main class="chat-area">
        <!-- Left side messages -->
        <div class="message message-left">
          <div class="message-bubble bubble-left">😍</div>
        </div>

        <div class="message message-left">
          <div class="message-bubble bubble-left">🥳</div>
        </div>

        <!-- Right side messages -->
        <div class="message message-right">
          <div class="message-bubble bubble-right bubble-green">
            <div class="bubble-tail tail-right"></div>
            สวัสดีจ้า
          </div>
        </div>

        <div class="message message-right">
          <div class="message-bubble bubble-right bubble-light-grey">
            Coding สนุกจังเลย
            <button class="close-btn">×</button>
          </div>
        </div>

        <div class="message message-right">
          <div class="message-bubble bubble-right bubble-green">
            <div class="bubble-tail tail-right"></div>
            😍🥳
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
